{% extends 'base.html' %}

{% block title %}Login - HMS{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card fade-in">
            <div class="card-header text-center py-4">
                <div class="d-inline-flex align-items-center justify-content-center mb-2 rounded-circle"
                    style="width: 56px; height: 56px; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.25);">
                    <i class="bi bi-person-circle text-indigo fs-3" style="color: #a5b4fc;"></i>
                </div>
                <h3 class="mb-0">Welcome Back</h3>
                <p class="mb-0 text-secondary small mt-1">Sign in to your account</p>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold">
                            <i class="bi bi-person me-2"></i>Username
                        </label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold">
                            <i class="bi bi-lock me-2"></i>Password
                        </label>
                        {{ form.password }}
                    </div>
                    {% if form.errors %}
                    <div class="alert alert-danger py-2 mt-2 fade-in">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Please correct the errors below.
                    </div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100 py-3 fs-5 mt-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>
            </div>
            <div class="text-center py-3"
                style="background: rgba(15, 23, 42, 0.4); border-top: 1px solid var(--border-color);">
                <p class="mb-0 text-secondary small">Don't have an account?
                    <a href="{% url 'accounts:signup' %}" class="text-decoration-none fw-semibold text-primary">
                        Sign up <i class="bi bi-arrow-right"></i>
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
